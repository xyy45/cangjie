[project]
name = "cangsight-nexus"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["pydantic==2.12.5", "mcp==1.26.0", "Flask==3.1.3", "httpx==0.28.1"]

[project.optional-dependencies]
dev = ["pytest==9.1.1"]

[tool.pytest.ini_options]
pythonpath = ["."]
markers = ["sdk: requires real pinned Cangjie SDK", "live: requires paid live model configuration"]
